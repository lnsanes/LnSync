# LnSync 更新服务器配置模板
# 复制为 config.toml 后修改。解析按「键 = 值」行匹配，不依赖 TOML 表层级。

[server]
listen = "127.0.0.1"
port = 8765
data_dir = "data"
public_url = "http://127.0.0.1:8765"

[source]
provider = "github"
repo = "Owner/PackName"
api = "https://api.github.com"
tag = ""
client_asset = "*Client*.zip"
server_asset = "*Server*.zip"
loader = "auto"   # auto|forge|neoforge|fabric|quilt

[auth]
# 玩家/客户端同步令牌（空 = 不校验，仅建议本机调试）
access_token = ""
# 开服端同步令牌（可选；设置后 side=server 必须用此令牌，与 access_token 隔离）
server_access_token = ""
# 管理网页口令（空 = 仅 127.0.0.1 可管理）
admin_token = ""

# 私货目录（其下使用 files/）
overlay_dir = "./private"

# 兼容旧键名（与上方等价，任选其一即可）
# github_repo = "Owner/PackName"
# github_api = "https://api.github.com"
# version = "v1.0.0"
